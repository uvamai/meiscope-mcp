# Release of meiscope-mcp from a v* tag, modelled on the Meiscope collector's
# release (ADR-0015): cross-platform binaries, MCP Bundles (.mcpb), the
# registry server.json with real hashes, CycloneDX SBOM, SHA256SUMS, cosign
# keyless signatures and build provenance, then a GitHub release.
#
# workflow_dispatch is a dry run: it builds and uploads everything as a
# workflow artifact and never signs or publishes. Nothing here submits to the
# MCP registry; server.json is attached to the release for a manual,
# reviewed submission.
#
# Actions are pinned by commit SHA; the tag is in the comment.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the dry run (no v), e.g. 0.1.0"
        required: true
        default: "0.0.0-dryrun"

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GO_VERSION: "1.27.3"
  TASK_VERSION: "3.54.0"
  COSIGN_VERSION: v3.1.4
  SYFT_VERSION: v1.55.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the Taskfile derives VERSION from the tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Tests (the release builds only what passes)
        run: task test
      - name: Binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: task build VERSION="$VERSION"
      - name: Bundles and server.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          go run ./tools/release -version "$VERSION" -bin bin -out release
          for t in linux_amd64 linux_arm64 darwin_arm64; do cp "bin/$t/meiscope-mcp" "release/meiscope-mcp_$t"; done
          for t in windows_amd64 windows_arm64; do cp "bin/$t/meiscope-mcp.exe" "release/meiscope-mcp_$t.exe"; done
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          syft-version: ${{ env.SYFT_VERSION }}
          output-file: release/meiscope-mcp.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Windows binaries are not Authenticode-signed
        run: echo "::warning title=Authenticode::Windows binaries are not Authenticode-signed (no code-signing certificate yet); they are cosign-signed like every asset."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unsigned
          path: release/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # GitHub release
      id-token: write # cosign keyless and attestations (GitHub OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-unsigned
          path: release/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign (cosign keyless)
        working-directory: release
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/meiscope-mcp_*
            release/server.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
