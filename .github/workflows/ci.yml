# CI for meiscope-mcp: lint, test (coverage gate), cross-build.
# Actions are pinned by full commit SHA, the same pins as the Meiscope core
# repository (ADR-0015); the tag is in the comment.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GO_VERSION: "1.27.3"
  COVERAGE_MIN: "85"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          out="$("$(go env GOPATH)/bin/gofumpt" -l .)"
          if [ -n "$out" ]; then echo "gofumpt would reformat:"; echo "$out"; exit 1; fi
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test -race
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage gate
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')"
          echo "total coverage: ${total}% (min ${COVERAGE_MIN}%)"
          if awk -v g="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit !(g < m) }'; then
            echo "::error::coverage ${total}% is below ${COVERAGE_MIN}%"; exit 1
          fi
      - name: Fuzz the certificate parser (short)
        run: go test ./internal/certinput -run '^$' -fuzz FuzzParseBytes -fuzztime 30s
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: coverage.out
          retention-days: 14

  build:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o "bin/meiscope-mcp_${GOOS}_${GOARCH}${{ matrix.ext }}" ./cmd/meiscope-mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meiscope-mcp_${{ matrix.goos }}_${{ matrix.goarch }}
          path: bin/
          retention-days: 14
